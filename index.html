
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e5f" />
    <title>REST BAZER - Business Management</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Bengali:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      /* Smooth Scrolling and Scrollbar Styling */
      html { scroll-behavior: smooth; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      body { 
        overscroll-behavior-y: none; 
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-weight: 700; 
        color: #0f172a;
        padding-bottom: env(safe-area-inset-bottom);
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      input, select, textarea, button {
        font-size: 16px !important;
      }

      /* Enhanced Modal Scrolling for Mobile */
      @media (max-width: 640px) {
        .modal-container {
          padding: 0 !important;
          align-items: flex-start !important;
        }
        .modal-content-full {
          width: 100% !important;
          height: 100% !important;
          min-height: 100dvh !important;
          max-height: 100dvh !important;
          border-radius: 0 !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch;
        }
        /* Extra padding for fixed footers on mobile in modals */
        .modal-footer-gap {
          padding-bottom: calc(100px + env(safe-area-inset-bottom)) !important;
        }
      }

      .font-black { font-weight: 900 !important; }
      .tracking-tightest { letter-spacing: -0.05em !important; }
      
      /* Active state animations */
      .active-scale:active { transform: scale(0.96); }
    </style>
</head>
  <body class="bg-slate-50 antialiased overflow-x-hidden custom-scrollbar">
    <script>
      window.addEventListener('error', function(e) {
        var overlay = document.getElementById('error-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'error-overlay';
          overlay.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fef2f2;color:#991b1b;padding:2rem;z-index:999999;overflow:auto;font-family:monospace;border:4px solid #f87171;';
          document.body.appendChild(overlay);
        }
        overlay.innerHTML = '<h1>🔴 Runtime Error</h1><p style="font-size:1.2rem;font-weight:bold;">' + e.message + '</p><p><b>File:</b> ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p><pre style="background:#fee2e2;padding:1rem;border-radius:8px;border:1px solid #fca5a5;">' + (e.error ? e.error.stack : 'No stack trace available') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var overlay = document.getElementById('error-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'error-overlay';
          overlay.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fef2f2;color:#991b1b;padding:2rem;z-index:999999;overflow:auto;font-family:monospace;border:4px solid #f87171;';
          document.body.appendChild(overlay);
        }
        var msg = e.reason ? (e.reason.message || e.reason.toString()) : 'Unknown promise rejection';
        var stack = e.reason && e.reason.stack ? e.reason.stack : 'No stack trace available';
        overlay.innerHTML = '<h1>🔴 Unhandled Promise Rejection</h1><p style="font-size:1.2rem;font-weight:bold;">' + msg + '</p><pre style="background:#fee2e2;padding:1rem;border-radius:8px;border:1px solid #fca5a5;">' + stack + '</pre>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
